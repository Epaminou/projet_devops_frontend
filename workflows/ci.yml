name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm ci

      - run: npm test -- --watch=false --browsers=ChromeHeadless

      - run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/todolist-frontend:${{ github.sha }} .

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/todolist-frontend:${{ github.sha }}
